name: Seat check

on:
  workflow_dispatch:          # triggered by cron-job.org, Cloudflare Worker (!seat), or manually
    inputs:
      mode:
        description: "reply = answer a !seat request (no state changes)"
        required: false
        default: ""

permissions:
  contents: write             # needed to commit state files back

# Normal runs queue behind each other (they push state files).
# !seat replies use their own group so they never replace a queued cron run.
concurrency:
  group: seat-check-${{ inputs.mode == 'reply' && 'reply' || 'normal' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated state
        if: ${{ !cancelled() && inputs.mode != 'reply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save whichever state files exist (downtime.json only exists after the first outage)
          mkdir -p /tmp/keep
          for f in state.json downtime.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/keep/; fi
          done

          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/keep/* . 2>/dev/null || true
            git add -- $(ls /tmp/keep)
            git diff --staged --quiet && exit 0
            git commit -m "Update state [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
